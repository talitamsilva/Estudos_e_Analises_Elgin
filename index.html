    #map { height: 540px; width: 100%; border-radius:12px; box-shadow: 0 2px 6px rgba(0,0,0,.06); }

    table { width:100%; border-collapse:collapse; }

    th { background:#f6fbfe; color:#2F3B52; text-align:left; }
    .kpis { display:grid; grid-template-columns: repeat(2, minmax(200px, 1fr)); gap:12px; margin:12px 0; }
    .card { background: #fff; border-radius:12px; padding:16px; box-shadow: 0 2px 6px rgba(0,0,0,.06); }
    .card h3 { margin:0; font-size:13px; color:#6b7a90; }
    .card .value { font-size:26px; color:#2F3B52; font-weight:700; }
    .hidden { display:none; }
  </style>
</head>

    const CITY_COORDS = {"null": [-23.55, -46.633]};
    const BRAND_BLUE = "#1A76B7";
    const OTHER_RED = "#8B0000";
    const PETROLEUM = "#2F3B52";
let map, markersLayer;

/* =====================
   INIT
   ===================== */
document.addEventListener('DOMContentLoaded', () => {
  populateFilters();
  setupMap();
  updateAll(DATA);
});

/* =====================
   MAPA
   ===================== */
function setupMap() {
  map = L.map('map').setView([-14.235, -51.925], 4);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
  markersLayer = L.layerGroup().addTo(map);
}

/* =====================
   FILTROS
   ===================== */
function populateFilters() {
  fill('fornecedorFilter', [...new Set(DATA.map(d => d.Fornecedor))]);
  fill('regiaoFilter', [...new Set(DATA.map(d => d.Região))]);
  fill('ufFilter', [...new Set(DATA.map(d => d.UF))]);
  fill('modalidadeFilter', [...new Set(DATA.map(d => d.Modalidade))]);

  fornecedorFilter.onchange =
  regiaoFilter.onchange =
  ufFilter.onchange =
  modalidadeFilter.onchange = applyFilters;
}

function fill(id, values) {
  const el = document.getElementById(id);
  values.sort().forEach(v => el.innerHTML += `<option value="${v}">${v}</option>`);
}

/* =====================
   🔴 CORREÇÃO DEFINITIVA
   ===================== */
function applyFilters() {
  const fornecedor = fornecedorFilter.value;
  const regiao = regiaoFilter.value;
  const uf = ufFilter.value;
  const modalidade = modalidadeFilter.value;

  if (!fornecedor && !regiao && !uf && !modalidade) {
    updateAll(DATA);
    return;
  }

  const filtered = DATA.filter(d =>
    (!fornecedor || d.Fornecedor === fornecedor) &&
    (!regiao || d.Região === regiao) &&
    (!uf || d.UF === uf) &&
    (!modalidade || d.Modalidade === modalidade)
  );

  updateAll(filtered);
}

function resetFilters() {
  fornecedorFilter.value = '';
  regiaoFilter.value = '';
  ufFilter.value = '';
  modalidadeFilter.value = '';
  updateAll(DATA);
}

/* =====================
   RENDER
   ===================== */
function updateAll(arr) {
  renderMarkers(arr);
}

function renderMarkers(arr) {
  markersLayer.clearLayers();
  arr.forEach(d => {
    const c = CITY_COORDS[d.Locais];
    if (!c) return;
    const color = d.Fornecedor.toLowerCase().includes('elgin') ? BRAND_BLUE : OTHER_RED;
    L.circleMarker(c, { radius:6, color }).addTo(markersLayer)
      .bindPopup(`<b>${d.Fornecedor}</b><br>${d.Locais} / ${d.UF}`);
  });
}
